# Render blueprint: one web service serves the API + the static frontend
# (engine/api.py mounts frontend/ at /), so a single URL runs the whole demo.
services:
  - type: web
    name: variance-explainer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --app-dir engine
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: MAX_MONTE_CARLO_SAMPLES
        value: "200"
      - key: DEFAULT_TARIFF_INR_PER_KWH
        value: "2.7"
